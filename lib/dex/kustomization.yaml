apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  app: dex
  component: dex

resources:
- deployment.yaml
- route.yaml
- sa.yaml
- service.yaml
- pvc.yaml

configMapGenerator:
- name: dex-config
  files:
  - config.yaml=files/dex-config.yaml

images:
- name: dex
  newName: ghcr.io/dexidp/dex
  newTag: v2.41.1
