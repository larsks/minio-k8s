apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
spec:
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - command:
            - /bin/sh
            - -c
            - |
              gomplate -f /config/config.yaml > /tmp/config.yaml
              exec /usr/local/bin/dex serve /tmp/config.yaml
          image: dex:main
          imagePullPolicy: IfNotPresent
          name: dex
          ports:
            - containerPort: 5556
              name: web
            - containerPort: 5557
              name: grpc
            - containerPort: 5558
              name: telemetry
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /config
              name: config
            - name: ssl
              mountPath: /etc/ssl/certs/ca.crt
              subPath: ca.crt
            - name: ssl
              mountPath: /etc/ssl/certs/namespace
              subPath: namespace
            - name: ssl
              mountPath: /etc/ssl/certs/service-ca.crt
              subPath: service-ca.crt
            - name: ssl
              mountPath: /etc/ssl/certs/token
              subPath: token
          env:
            - name: OPENSHIFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-sa-token
                  key: token
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dex-data
        - name: config
          configMap:
            name: dex-config
        - name: ssl
          secret:
            secretName: dex-sa-token
            items:
              - key: ca.crt
                path: ca.crt
              - key: namespace
                path: namespace
              - key: service-ca.crt
                path: service-ca.crt
              - key: token
                path: token
